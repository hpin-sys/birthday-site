<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday!</title>
  <style>
    body {
      margin: 0;
      background-color: #e98484;
      overflow: hidden;
      font-family: 'Comic Sans MS', cursive;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 90px;
      margin-top: 130px;
      animation: colorChange 3s infinite, bounce 2s infinite alternate;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-30px); } 
    }  

    @keyframes colorChange {
      0% { color: #ff6ec7; }
      50% { color: #ffe066; }
      100% { color: #6effa3; }
    }
    @keyframes floatLoop {
  0% {
    transform: translateY(500px);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  90% {
    opacity: 1;
  }
  100% {
    transform: translateY(-500px);
    opacity: 0;
  }
}
.balloon {
  position: absolute;
  width: 160px;
  height: 180px;
  background: radial-gradient(circle at 30% 30%, #ff4ecf, #d1005d);
  border-radius: 50% 50% 50% 50%;
  cursor: pointer;
  animation: floatLoop 9s linear infinite;
}

    .balloon::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 30px;
      background: white;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
    }

    .balloon:hover {
      transform: scale(1.1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
    <h1 id="message">click me.</h1>

  <canvas id="confetti-canvas"></canvas>

  
  
  <div id="balloon-container"></div>
  <script>
        document.addEventListener('click', (e) => {
      createBurst(e.clientX, e.clientY);
    });

    const message = document.getElementById('message');
    let clicked = false;

    message.addEventListener('click', () => {
      if (!clicked) {
        message.innerText = "Happy birthday Djihan!!";
        clicked = true;
      } else {
        message.innerText = " pop the balloons!! .";
        clicked = false;
      }
      createBurst(window.innerWidth / 2, window.innerHeight / 2, 100);
    });
  const balloonContainer = document.getElementById('balloon-container');

  for (let i = 0; i < 10; i++) {
    const balloon = document.createElement('div');
    balloon.className = 'balloon';
    balloon.style.left = Math.floor(Math.random() * 100) + '%';
    balloon.style.top = Math.floor(Math.random() * 900) + 'px';
    balloon.onclick = popBalloon;
    balloonContainer.appendChild(balloon);
  }


    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];

    function createConfettiBurst(x, y, count = 50) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          r: Math.random() * 6 + 2,
          color: `hsl(${Math.random() * 360}, 100%, 50%)`,
          life: 100
        });
      }
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2; // gravity
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      });
      requestAnimationFrame(drawConfetti);
    }

    drawConfetti();

    function popBalloon(event) {
      const balloon = event.target;
      const rect = balloon.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      createConfettiBurst(x, y, 80);
      balloon.remove(); // Remove balloon after popping
    }

  </script>

</body>
</html>
